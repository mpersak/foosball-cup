<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foosball Cup</title>
<meta name="theme-color" content="#0e5a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Foosball">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f3f5f2; --card: #ffffff; --text: #17201b; --muted: #64706a; --line: #dfe5e0;
  --brand: #0e5a3a; --brand-2: #16865a; --on-brand: #ffffff; --accent: #e8a317;
  --win: #16865a; --chip: #e7ede9; --danger: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1412; --card: #19211d; --text: #e8eee9; --muted: #93a19a; --line: #2a3530;
    --brand: #1f9e68; --brand-2: #27b678; --on-brand: #06120c; --accent: #f0b43a;
    --win: #3fcf8e; --chip: #24302a; --danger: #ef6b62;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh;
  padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
header { position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
header h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .2px; }
header button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 22px 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.center { text-align: center; }
.small { font-size: 13px; }
button { font: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
.primary { display: block; width: 100%; background: var(--brand); color: var(--on-brand); border: 0; border-radius: 12px;
  padding: 14px; font-size: 17px; font-weight: 600; margin-top: 14px; }
.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 9px 12px; }
.danger { color: var(--danger); }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.row-btns > * { flex: 1; }

/* setup */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid transparent; background: var(--chip); color: var(--text); border-radius: 999px; padding: 9px 14px; font-weight: 500; }
.chip.on { background: var(--brand); color: var(--on-brand); }
.chip.rm { border-color: var(--danger); color: var(--danger); background: transparent; }
.addform { display: flex; gap: 8px; margin-top: 12px; }
.addform input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 8px; border-radius: 8px; }
.seg button.on { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.15); font-weight: 600; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-top: 4px; }
.summary b { display: block; font-size: 24px; }

/* play */
.progress { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--brand-2); transition: width .3s; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .6px; padding: 3px 8px; border-radius: 6px;
  background: var(--chip); color: var(--muted); text-transform: uppercase; }
.badge.d { background: var(--accent); color: #2a1d00; }
.match { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; margin-top: 16px; }
.names { font-size: 22px; font-weight: 700; text-align: center; line-height: 1.25; word-break: break-word; }
.live .names { font-size: 28px; }
.vs { color: var(--muted); font-weight: 600; }
.ask { text-align: center; margin: 18px 0 0; color: var(--muted); font-weight: 600; }
.winbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.winbtn { background: var(--brand); color: var(--on-brand); border: 0; border-radius: 12px; padding: 16px 8px; font-size: 17px; font-weight: 700; line-height: 1.25; word-break: break-word; }
.winbtn.cur { outline: 3px solid var(--accent); }
.badge.live-b { background: #d93a2b; color: #fff; }
.teams { display: grid; gap: 8px; margin: 12px 0 4px; }
.team { background: var(--chip); border-radius: 10px; padding: 10px 12px; font-weight: 600; text-align: center; }
.team.slot { font-variant-numeric: tabular-nums; }
.sitout { font-size: 14px; color: var(--muted); margin-top: 8px; }
.champ { text-align: center; }
.champ .big { font-size: 34px; font-weight: 800; margin: 4px 0; color: var(--brand-2); }

/* lists */
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.gm { display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center; gap: 6px; width: 100%; padding: 11px 12px;
  background: transparent; border: 0; border-top: 1px solid var(--line); color: var(--text); text-align: left; font-size: 15px; }
.gm:first-child { border-top: 0; }
.gm .r { text-align: right; }
.gm .sc { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.gm.done .sc { color: var(--text); }
.gm.next { background: color-mix(in srgb, var(--brand-2) 12%, transparent); }
.gm .wn { font-weight: 700; color: var(--win); }
.grouphead { padding: 10px 12px; font-size: 13px; color: var(--muted); background: var(--chip); border-top: 1px solid var(--line); }
.grouphead:first-child { border-top: 0; }
.prow { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--line); font-weight: 600; }
.prow:first-child { border-top: 0; }
tr.gone td { opacity: .5; }

table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th, td { padding: 10px 8px; text-align: center; border-top: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; border-top: 0; }
td.nm, th.nm { text-align: left; font-weight: 600; }
tr.lead td { color: var(--brand-2); }

/* nav */
nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; background: transparent; border: 0; color: var(--muted); padding: 12px 4px 14px; font-size: 13px; font-weight: 600; }
nav button.on { color: var(--brand-2); box-shadow: inset 0 3px 0 var(--brand-2); }

/* modal + toast */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 20;
  background: #222; color: #fff; padding: 10px 14px; border-radius: 10px; display: flex; gap: 14px; align-items: center; font-size: 15px; max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; }
details summary { cursor: pointer; padding: 4px 0; }
.linkname { background: none; border: 0; padding: 0; color: inherit; font-weight: 600; text-decoration: underline dotted; text-underline-offset: 3px; }
.back { background: none; border: 0; color: var(--brand-2); font-weight: 600; padding: 0 0 10px; }
.banner { background: color-mix(in srgb, var(--accent) 22%, var(--card)); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin: 12px 0; }
.kpis b { display: block; font-size: 22px; }
.spark { width: 100%; height: 60px; display: block; margin-top: 6px; }
.pickside { margin-top: 14px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Foosball Cup</h1>
  <button id="playersBtn" data-act="players" hidden>Players</button>
  <button id="menuBtn" data-act="menu" hidden>End</button>
</header>
<main id="app"></main>
<nav id="tabs">
  <button data-act="tab" data-view="play">Play</button>
  <button data-act="tab" data-view="table">Table</button>
  <button data-act="tab" data-view="games">Games</button>
  <button data-act="tab" data-view="history">History</button>
</nav>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="schedule.js"></script>
<script src="stats.js"></script>
<script src="share.js"></script>
<script>
'use strict';
const KEY = 'foosball.v1';
const DEFAULT_PLAYERS = ['Matevz', 'Zoki', 'Aljosa', 'David', 'Cica'];
const MIN_P = 4, MAX_P = 8;

// ---------- state (stored on the phone in localStorage) ----------
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.roster)) return s;
  } catch (e) { /* fall through to defaults */ }
  return { roster: DEFAULT_PLAYERS.slice(), selected: DEFAULT_PLAYERS.slice(), current: null, history: [] };
}
let S = load();
// Tournaments saved by earlier versions have no leave/join fields
[S.current, ...S.history].forEach(t => { if (t) { t.left = t.left || []; t.changed = !!t.changed; } });
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save - storage is full or blocked'); }
}
// Ask the browser not to evict our data under storage pressure (best effort).
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ---------- ui state ----------
// view: play | table | games | history | past (one finished tournament) | shared (opened from a link)
let view = 'play', tableMode = 'all', pastIdx = 0, rosterEdit = false, drawing = false;
let modal = null;    // { kind: 'edit' | 'add' | 'players' | 'swap' | 'profile', ... }
let shared = null;   // tournaments from a share link (read only)

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const names = side => side.map(esc).join(' &amp; ');
const pct = s => s.p ? Math.round((s.w / s.p) * 100) + '%' : '-';
const nextMatch = t => t.matches.find(m => m.w == null);
const playedCount = t => t.matches.filter(m => m.w != null).length;
const activePlayers = t => t.players.filter(p => !t.left.includes(p));
const day = t => new Date(t.started).toLocaleDateString();
// Round numbers can have gaps after someone leaves or joins, so label by position. Added games have no round.
const roundList = t => [...new Set(t.matches.filter(m => !m.extra).map(m => m.round))].sort((x, y) => x - y);
const roundLabel = (t, m) => {
  if (m.extra) return 'Added game';
  const rs = roundList(t);
  return `Round ${rs.indexOf(m.round) + 1} of ${rs.length}`;
};
// Tournaments the History views show: from a share link, or this phone's finished ones
const historyList = () => (shared || S.history);

// ---------- rendering ----------
function render() {
  const t = S.current;
  if (!t && (view === 'table' || view === 'games')) view = 'play';
  let html;
  if (shared) html = renderShared();
  else if (view === 'history') html = renderHistory(S.history, false);
  else if (view === 'past' && S.history[pastIdx]) html = renderPast(S.history[pastIdx], false);
  else if (!t) { if (view === 'past') view = 'history'; html = view === 'history' ? renderHistory(S.history, false) : renderSetup(); }
  else if (view === 'table') html = standingsBlock(t);
  else if (view === 'games') html = renderGames(t, true);
  else html = renderPlay(t);
  $('#app').innerHTML = html;
  $('#modal').innerHTML = renderModal();
  $('#tabs').hidden = !!shared;
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.view === view || (view === 'past' && b.dataset.view === 'history'));
    if (b.dataset.view === 'play') b.textContent = t ? 'Play' : 'New';
    if (b.dataset.view === 'table' || b.dataset.view === 'games') b.disabled = !t;
  });
  $('#menuBtn').hidden = !t || !!shared;
  $('#playersBtn').hidden = !t || !!shared;
  updateWakeLock();
}

function renderModal() {
  if (!modal) return '';
  const body = {
    edit: renderEdit, add: renderAdd, players: renderPlayers, swap: renderSwap, profile: renderProfile
  }[modal.kind]();
  return `<div class="overlay" data-act="closeModal"><div class="sheet" data-stop>${body}</div></div>`;
}

function renderSetup() {
  const sel = S.selected.filter(p => S.roster.includes(p));
  const n = sel.length, ok = n >= MIN_P && n <= MAX_P;
  const c = ok ? Sched.counts(n) : null;
  return `
  <section class="card">
    <div class="label">Who is playing? (${n} selected)</div>
    <div class="chips" style="margin-top:10px">
      ${S.roster.map(p => `<button class="chip ${rosterEdit ? 'rm' : sel.includes(p) ? 'on' : ''}" data-act="${rosterEdit ? 'remove' : 'toggle'}" data-name="${esc(p)}">${rosterEdit ? '&times; ' : ''}${esc(p)}</button>`).join('')}
    </div>
    <form class="addform" id="addForm" autocomplete="off">
      <input id="newName" maxlength="20" placeholder="New player name">
      <button class="ghost" type="submit">Add</button>
    </form>
    <div class="row-btns"><button class="ghost small" data-act="rosterEdit">${rosterEdit ? 'Done removing' : 'Remove players from list'}</button></div>
  </section>
  <section class="card">
    ${ok ? `
      <div class="summary">
        <div><b>${c.singles}</b><span class="muted small">singles</span></div>
        <div><b>${c.doubles}</b><span class="muted small">doubles</span></div>
        <div><b>${c.total}</b><span class="muted small">games total</span></div>
      </div>
      <p class="muted small">${c.draws} rounds. Each round: ${c.singlesPerRound} singles, then a random doubles draw where
      ${c.teams} teams all play each other${n % 2 ? ' (one player sits out each draw)' : ''}.
      By the end everyone has played everyone in singles and partnered everyone once in doubles.
      Games are ordered so nobody sits out for long.</p>`
      : `<p class="muted">Pick between ${MIN_P} and ${MAX_P} players.</p>`}
    <button class="primary" data-act="start" ${ok ? '' : 'disabled'}>Start tournament</button>
  </section>`;
}

function renderPlay(t) {
  const done = playedCount(t), total = t.matches.length;
  const m = nextMatch(t);
  let h = `<div class="progress"><div style="width:${(done / total) * 100}%"></div></div>
    <p class="muted center small">${done} of ${total} games played</p>`;

  if (!m) {
    const ch = Sched.champion(t);
    return h + `
      <section class="card champ">
        <div class="label">Champion</div>
        <div class="big">${ch ? esc(ch.name) : '-'}</div>
        ${ch ? `<p class="muted">${ch.w} wins from ${ch.p} games (${pct(ch)})</p>` : ''}
        <button class="primary" data-act="finish">Finish and save to history</button>
      </section>
      ${tableHtml(Sched.standings(t, 'all'))}`;
  }

  const d = t.draws[m.round];
  if (m.type === 'D' && !t.revealed.includes(m.round)) {
    return h + `
      <section class="card">
        <div class="label">${roundLabel(t, m)} &middot; Doubles draw</div>
        <div class="teams" id="drawBox">${d.teams.map(() => '<div class="team slot">? &amp; ?</div>').join('')}</div>
        ${d.bye ? '<p class="sitout">One player sits out this draw.</p>' : ''}
        <button class="primary" data-act="draw">Draw teams</button>
      </section>`;
  }

  // Next game: tap Play to start it, then tap the winning side to finish it.
  const live = t.live === m.id;
  const canSwap = !live && Sched.swapOptions(t).length > 0;
  h += `
    <section class="card ${live ? 'live' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="badge ${m.type === 'D' ? 'd' : ''}">${m.type === 'D' ? 'Doubles' : 'Singles'}</span>
        ${live ? '<span class="badge live-b">Playing</span>' : ''}
        <span class="label">${roundLabel(t, m)} &middot; Game ${m.id + 1}</span>
      </div>
      <div class="match">
        <div class="names">${m.a.map(esc).join('<br>')}</div>
        <div class="vs">vs</div>
        <div class="names">${m.b.map(esc).join('<br>')}</div>
      </div>
      ${live ? `
        <p class="ask">Who won?</p>
        ${winnerButtons(m, 'winner')}
        <div class="row-btns"><button class="ghost small" data-act="stop">Not started yet</button></div>`
      : `<button class="primary" data-act="play">Play</button>
         ${canSwap ? '<div class="row-btns"><button class="ghost small" data-act="swap">Someone not ready? Swap game</button></div>' : ''}`}
      ${m.type === 'D' && d && d.teams.length > 2 ? `<p class="sitout center">Teams this round: ${d.teams.map(names).join(' &middot; ')}</p>` : ''}
      ${m.type === 'D' && d && d.bye ? `<p class="sitout center">Sitting out: ${esc(d.bye)}</p>` : ''}
    </section>`;

  const upcoming = t.matches.filter(x => x.w == null && x.id !== m.id).slice(0, 4);
  if (upcoming.length) h += `<h2>Up next</h2><div class="list">${upcoming.map(x => gameRow(t, x, false)).join('')}</div>`;
  const last = t.matches.filter(x => x.w != null).sort((a, b) => (b.at || 0) - (a.at || 0))[0];
  if (last) h += `<h2>Last result</h2><div class="list">${gameRow(t, last, true)}</div>`;
  return h;
}

// One big button per side; `m.w` highlights the current winner when editing.
function winnerButtons(m, act) {
  return `<div class="winbtns">
    <button class="winbtn ${m.w === 'a' ? 'cur' : ''}" data-act="${act}" data-id="${m.id}" data-side="a">${names(m.a)}</button>
    <button class="winbtn ${m.w === 'b' ? 'cur' : ''}" data-act="${act}" data-id="${m.id}" data-side="b">${names(m.b)}</button>
  </div>`;
}

function gameRow(t, m, editable) {
  const hidden = m.type === 'D' && !m.extra && !t.revealed.includes(m.round) && m.w == null && !t.shared;
  const played = m.w != null;
  const a = hidden ? 'Team ?' : names(m.a), b = hidden ? 'Team ?' : names(m.b);
  const isNext = !t.finished && nextMatch(t) === m;
  const tag = editable && !hidden ? `data-act="edit" data-id="${m.id}"` : 'disabled';
  return `<button class="gm ${played ? 'done' : ''} ${isNext ? 'next' : ''}" ${tag}>
    <span class="${m.w === 'a' ? 'wn' : ''}">${m.w === 'a' ? '&#10003; ' : ''}${a}</span>
    <span class="sc">vs</span>
    <span class="r ${m.w === 'b' ? 'wn' : ''}">${b}${m.w === 'b' ? ' &#10003;' : ''}</span>
  </button>`;
}

function renderGames(t, editable) {
  const rounds = roundList(t);
  const finished = !!t.finished || !!t.shared;
  const extras = t.matches.filter(m => m.extra);
  const groups = rounds.map((r, ri) => {
    const ms = t.matches.filter(m => m.round === r && !m.extra && (!finished || m.w != null));
    const s = ms.filter(m => m.type === 'S'), dd = ms.filter(m => m.type === 'D');
    const d = t.draws && t.draws[r];
    let out = '';
    if (s.length) out += `<div class="grouphead">Round ${ri + 1} &middot; Singles</div>${s.map(m => gameRow(t, m, editable)).join('')}`;
    if (dd.length) {
      const shown = d && t.revealed.includes(r);
      out += `<div class="grouphead">Round ${ri + 1} &middot; Doubles${shown ? ` &middot; ${d.teams.map(names).join(', ')}${d.bye ? ` &middot; out: ${esc(d.bye)}` : ''}` : finished ? '' : ' &middot; teams not drawn yet'}</div>${dd.map(m => gameRow(t, m, editable)).join('')}`;
    }
    return out;
  }).join('');
  const extraHtml = extras.length ? `<div class="grouphead">Added games</div>${extras.map(m => gameRow(t, m, editable)).join('')}` : '';
  return `<div class="list">${groups + extraHtml || '<div class="grouphead">No games</div>'}</div>
    ${editable ? `<button class="ghost" style="width:100%;margin-top:10px" data-act="addGame">+ Add a missed game</button>
    <p class="muted small center">Tap a game to set or change its winner.</p>` : ''}`;
}

function tableHtml(st) {
  let rank = 0;
  return `<table>
    <tr><th>#</th><th class="nm">Player</th><th>P</th><th>W</th><th>L</th><th>Win</th></tr>
    ${st.map((s, i) => {
      const note = s.left ? ' <span class="muted small">(left)</span>' : !s.ranked && s.p ? ' <span class="muted small">(few games)</span>' : '';
      return `<tr class="${i === 0 && s.ranked && s.w > 0 ? 'lead' : ''} ${s.ranked ? '' : 'gone'}"><td>${s.ranked ? ++rank : ''}</td><td class="nm">${esc(s.name)}${note}</td><td>${s.p}</td><td><b>${s.w}</b></td><td>${s.l}</td><td>${pct(s)}</td></tr>`;
    }).join('')}
  </table>`;
}

// Doubles results per pair of players
function teamTableHtml(ts) {
  if (!ts.length) return '<p class="muted center">No doubles played yet.</p>';
  return `<table>
    <tr><th>#</th><th class="nm">Team</th><th>P</th><th>W</th><th>L</th><th>Win</th></tr>
    ${ts.map((s, i) => `<tr class="${i === 0 && s.w > 0 ? 'lead' : ''}"><td>${i + 1}</td><td class="nm">${s.names.map(esc).join(' &amp; ')}</td><td>${s.p}</td><td><b>${s.w}</b></td><td>${s.l}</td><td>${pct(s)}</td></tr>`).join('')}
  </table>`;
}

// Overall / Singles / Doubles / Teams tables for one tournament
function standingsBlock(t) {
  const note = tableMode === 'T' ? 'Each doubles pairing, ranked by win %, then wins.'
    : 'Ranked by win %, so playing more games is no advantage; ties go to more wins. Players with under half the games of the busiest player are listed but not ranked.';
  return `
    <div class="seg" style="margin-bottom:12px">
      ${[['all', 'Overall'], ['S', 'Singles'], ['D', 'Doubles'], ['T', 'Teams']].map(([k, l]) => `<button class="${tableMode === k ? 'on' : ''}" data-act="tmode" data-v="${k}">${l}</button>`).join('')}
    </div>
    ${tableMode === 'T' ? teamTableHtml(Sched.teamStandings([t])) : tableHtml(Sched.standings(t, tableMode))}
    <p class="muted small">${note} P = played.</p>`;
}

function renderHistory(list, readonly) {
  const rows = Stats.allTime(list);
  return `
    ${list.length ? `<h2 style="margin-top:0">All time</h2>
    <table><tr><th class="nm">Player</th><th>Rating</th><th>Cups</th><th>P</th><th>Win</th></tr>
      ${rows.map((r, i) => `<tr class="${i === 0 ? 'lead' : ''}"><td class="nm"><button class="linkname" data-act="profile" data-name="${esc(r.name)}">${esc(r.name)}</button></td><td><b>${r.rating}</b></td><td>${r.cups}</td><td>${r.p}</td><td>${pct(r)}</td></tr>`).join('')}
    </table>
    <p class="muted small">Rating starts at 1000 and goes up more for beating stronger players, so it reflects who you beat, not how many games you played. Tap a name for their stats.</p>
    <h2>All-time doubles teams</h2>
    ${teamTableHtml(Sched.teamStandings(list))}
    <h2>Tournaments</h2>
    <div class="list">${list.map((t, i) => {
      const ch = Sched.champion(t);
      return `<button class="gm" style="grid-template-columns:1fr auto" data-act="openPast" data-i="${i}">
        <span><b>${day(t)}</b> &middot; ${t.players.length} players, ${playedCount(t)} games</span>
        <span class="r wn">${ch ? esc(ch.name) : ''}</span></button>`;
    }).join('')}</div>
    ${readonly ? '' : '<button class="ghost" style="width:100%;margin-top:10px" data-act="shareAll">Share all-time stats</button>'}`
    : '<p class="muted center">No finished tournaments yet.</p>'}
    ${readonly ? '' : `<h2>Backup</h2>
    <section class="card">
      <p class="muted small" style="margin-top:0">Everything is stored only on this phone. Export a backup now and then, or to move to another phone.</p>
      <div class="row-btns">
        <button class="ghost" data-act="export">Export backup</button>
        <button class="ghost" data-act="import">Import backup</button>
      </div>
    </section>`}`;
}

// One finished tournament: full tables, all games, add a missed game, share
function renderPast(t, readonly, showBack = true) {
  const ch = Sched.champion(t);
  return `
    ${showBack ? '<button class="back" data-act="backHistory">&larr; History</button>' : ''}
    <section class="card champ">
      <div class="label">${day(t)} &middot; ${t.players.length} players &middot; ${playedCount(t)} games</div>
      <div class="big">${ch ? esc(ch.name) : '-'}</div>
      ${ch ? `<p class="muted">Champion &middot; ${ch.w} wins from ${ch.p} games (${pct(ch)})</p>` : ''}
      ${readonly ? '' : '<button class="primary" data-act="shareOne">Share results</button>'}
    </section>
    ${standingsBlock(t)}
    <h2>Games</h2>
    ${renderGames(t, !readonly)}
    ${readonly ? '' : '<div class="row-btns"><button class="ghost small danger" data-act="delHist">Delete this tournament</button></div>'}`;
}

// Opened from a share link: read only, with an option to keep a copy
function renderShared() {
  const one = shared.length === 1;
  const banner = `<section class="card banner">
    <b>Shared results</b> <span class="muted small">&middot; view only</span>
    <div class="row-btns">
      <button class="ghost" data-act="saveShared">Save to this phone</button>
      <button class="ghost" data-act="closeShared">Open my app</button>
    </div></section>`;
  if (one) return banner + renderPast(shared[0], true, false);
  if (view === 'past' && shared[pastIdx]) return banner + renderPast(shared[pastIdx], true);
  return banner + renderHistory(shared, true);
}

function renderEdit() {
  const { t, id } = modal, m = t.matches[id];
  return `
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="badge ${m.type === 'D' ? 'd' : ''}">${m.type === 'D' ? 'Doubles' : 'Singles'}</span>
      <span class="label">${roundLabel(t, m)} &middot; Game ${m.id + 1}</span>
    </div>
    <p class="ask">Who won?</p>
    ${winnerButtons(m, 'mwinner')}
    <div class="row-btns">
      ${m.extra ? '<button class="ghost danger" data-act="delGame">Delete game</button>'
        : m.w != null && !t.finished ? '<button class="ghost danger" data-act="clear">Clear result</button>' : ''}
      <button class="ghost" data-act="closeModal">Cancel</button>
    </div>`;
}

// Add a missed game: pick 1-2 players a side, then tap the winner
function renderAdd() {
  const { t, a, b } = modal;
  const chips = (side, list, other) => `<div class="chips" style="margin-top:8px">${list.map(p => {
    const on = side.includes(p), off = other.includes(p) || (!on && side.length >= 2);
    return `<button class="chip ${on ? 'on' : ''}" data-act="addPick" data-side="${side === a ? 'a' : 'b'}" data-name="${esc(p)}" ${off ? 'disabled' : ''}>${esc(p)}</button>`;
  }).join('')}</div>`;
  const ready = a.length && b.length;
  return `
    <div class="label">Add a missed game</div>
    <p class="muted small">For a game that was played but not recorded. Pick one or two players for each side.</p>
    <div class="pickside"><b>Side 1</b>${chips(a, t.players, b)}</div>
    <div class="pickside"><b>Side 2</b>${chips(b, t.players, a)}</div>
    <p class="ask">Who won?</p>
    <div class="winbtns">
      <button class="winbtn" data-act="addSave" data-side="a" ${ready ? '' : 'disabled'}>${a.length ? names(a) : 'Side 1'}</button>
      <button class="winbtn" data-act="addSave" data-side="b" ${ready ? '' : 'disabled'}>${b.length ? names(b) : 'Side 2'}</button>
    </div>
    <div class="row-btns"><button class="ghost" data-act="closeModal">Cancel</button></div>`;
}

// Someone isn't ready: play another already-scheduled game first
function renderSwap() {
  const t = S.current, m = nextMatch(t);
  const busy = [...m.a, ...m.b];
  const opts = Sched.swapOptions(t);
  return `
    <div class="label">Swap game</div>
    <p class="muted small">Play one of these scheduled games first instead of <b>${names(m.a)} vs ${names(m.b)}</b>. That game moves to where this one was.</p>
    <div class="list">${opts.map(o => {
      const clash = [...o.a, ...o.b].some(p => busy.includes(p));
      return `<button class="gm" data-act="swapTo" data-id="${o.id}">
        <span>${names(o.a)}</span><span class="sc">${o.type === 'D' ? 'dbl' : 'vs'}</span><span class="r">${names(o.b)}${clash ? ' <span class="muted small">*</span>' : ''}</span></button>`;
    }).join('')}</div>
    <p class="muted small">* includes someone from the current game.</p>
    <div class="row-btns"><button class="ghost" data-act="closeModal">Cancel</button></div>`;
}

// One player's all-time stats
function renderProfile() {
  const p = Stats.profile(historyList(), modal.name);
  const all = { p: p.singles.p + p.doubles.p, w: p.singles.w + p.doubles.w };
  const rec = r => `${r.w}-${r.p - r.w} (${pct(r)})`;
  const tr = [Stats.START, ...p.trend];
  const lo = Math.min(...tr), hi = Math.max(...tr), span = Math.max(1, hi - lo);
  const pts = tr.map((v, i) => `${(i / Math.max(1, tr.length - 1)) * 300},${55 - ((v - lo) / span) * 50}`).join(' ');
  const recTable = (rows, head) => rows.length ? `<table><tr><th class="nm">${head}</th><th>P</th><th>W</th><th>L</th><th>Win</th></tr>
    ${rows.map(r => `<tr><td class="nm">${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.p - r.w}</td><td>${pct(r)}</td></tr>`).join('')}</table>` : '<p class="muted small">None yet.</p>';
  return `
    <div class="label">Player</div>
    <div style="font-size:26px;font-weight:800">${esc(p.name)}</div>
    <div class="kpis">
      <div><b>${p.rating}</b><span class="muted small">rating</span></div>
      <div><b>${p.cups}</b><span class="muted small">cups</span></div>
      <div><b>${pct(all)}</b><span class="muted small">won</span></div>
    </div>
    <svg class="spark" viewBox="0 0 300 60" preserveAspectRatio="none" aria-label="Rating over time">
      <polyline points="${pts}" fill="none" stroke="var(--brand-2)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <p class="muted small">Rating after each game. Singles ${rec(p.singles)} &middot; Doubles ${rec(p.doubles)} &middot;
      ${p.tournaments} tournaments &middot; best winning run ${p.bestRun}</p>
    <h2>With each partner (doubles)</h2>${recTable(p.partners, 'Partner')}
    <h2>Against each player (singles)</h2>${recTable(p.rivals, 'Opponent')}
    <div class="row-btns"><button class="ghost" data-act="closeModal">Close</button></div>`;
}

// Who is playing: someone can go home (Leaves) or arrive late (Join).
function renderPlayers() {
  const t = S.current, active = activePlayers(t);
  const others = [...new Set([...t.left, ...S.roster])].filter(p => !active.includes(p));
  const canJoin = active.length < MAX_P;
  return `
    <div class="label">Playing now (${active.length})</div>
    <div class="list" style="margin-top:8px">${active.map(p => `
      <div class="prow"><span>${esc(p)}</span>
        <button class="ghost small danger" data-act="leave" data-name="${esc(p)}" ${active.length <= 2 ? 'disabled' : ''}>Leaves</button></div>`).join('')}
    </div>
    <div class="label" style="margin-top:18px">Late arrival</div>
    ${canJoin ? `
      ${others.length ? `<div class="chips" style="margin-top:8px">${others.map(p => `<button class="chip" data-act="join" data-name="${esc(p)}">+ ${esc(p)}</button>`).join('')}</div>` : ''}
      <form class="addform" id="joinForm" autocomplete="off">
        <input id="joinName" maxlength="20" placeholder="New player name">
        <button class="ghost" type="submit">Join</button>
      </form>` : `<p class="muted small">Already at the maximum of ${MAX_P} players.</p>`}
    <p class="muted small">When someone leaves, a game in progress is still finished, their other unplayed games are dropped (no forfeits) and the doubles are redrawn for everyone still here. Games already played stay as they are.</p>
    <button class="ghost" style="width:100%" data-act="closeModal">Close</button>`;
}

// ---------- actions ----------
function toast(msg, actionLabel, action) {
  const el = $('#toast');
  el.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${actionLabel ? `<button id="toastAct">${esc(actionLabel)}</button>` : ''}</div>`;
  if (actionLabel) $('#toastAct').onclick = () => { el.innerHTML = ''; action(); };
  clearTimeout(toast.tm);
  toast.tm = setTimeout(() => { el.innerHTML = ''; }, 4000);
}

function setWinner(t, id, side) {
  const m = t.matches[id];
  const prev = { w: m.w, at: m.at, live: t.live };
  m.w = side; m.at = m.at || Date.now();
  if (t.live === id) t.live = null;
  modal = null;
  save(); render();
  toast(`${(side === 'a' ? m.a : m.b).join(' & ')} won`, 'Undo', () => {
    m.w = prev.w; m.at = prev.at; t.live = prev.live; save(); render();
  });
}

// Leave or join, with undo. Rebuilds the unplayed part of the schedule.
function changePlayers(name, joining) {
  const t = S.current;
  const msg = joining
    ? `${name} joins now? They get singles against everyone still here and are added to the doubles draws.`
    : `${name} is going home? A game in progress is still finished; their other unplayed games are dropped and the doubles are redrawn.`;
  if (!confirm(msg)) return;
  const snapshot = JSON.stringify(t);
  joining ? Sched.join(t, name) : Sched.leave(t, name);
  modal = null; view = 'play';
  save(); render();
  const togo = t.matches.length - playedCount(t);
  toast(`${name} ${joining ? 'joined' : 'left'} · ${togo} games to go`, 'Undo', () => {
    S.current = JSON.parse(snapshot); save(); render();
  });
}

function finishTournament(t) {
  t.finished = new Date().toISOString();
  t.live = null;
  S.history.unshift(t); S.current = null;
  view = 'past'; pastIdx = 0; tableMode = 'all';
  save(); render(); window.scrollTo(0, 0);
}

function doDraw() {
  if (drawing) return;
  drawing = true;
  const t = S.current, m = nextMatch(t);
  const slots = [...document.querySelectorAll('#drawBox .slot')];
  const btn = document.querySelector('[data-act="draw"]');
  if (btn) btn.disabled = true;
  let n = 0;
  // Shuffle animation; the teams themselves were drawn randomly when the schedule was made.
  const iv = setInterval(() => {
    const p = Sched.shuffle(activePlayers(t));
    slots.forEach((s, i) => { s.textContent = `${p[2 * i]} & ${p[2 * i + 1]}`; });
    if (++n > 16) {
      clearInterval(iv);
      t.revealed.push(m.round);
      save(); drawing = false; render();
    }
  }, 80);
}

// Share a link with the results packed into it. Uses the phone's share menu, or copies the link.
async function shareLink(list, title) {
  try {
    const url = `${location.origin}${location.pathname}#s=${await Share.encode(list)}`;
    if (navigator.share) {
      await navigator.share({ title, text: title, url });
    } else {
      await navigator.clipboard.writeText(url);
      toast('Link copied - paste it anywhere');
    }
  } catch (e) {
    if (e && e.name !== 'AbortError') toast('Could not share the link');
  }
}

async function openSharedLink() {
  const m = location.hash.match(/^#s=(.+)$/);
  if (!m) return false;
  try {
    shared = await Share.decode(m[1]);
    view = 'shared'; pastIdx = 0; tableMode = 'all';
  } catch (e) {
    shared = null;
    toast('That link could not be opened');
  }
  render();
  return true;
}

function closeShared() {
  shared = null; view = 'history';
  history.replaceState(null, '', location.pathname);
  render();
}

function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `foosball-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.roster) || !Array.isArray(data.history)) throw new Error('bad file');
    if (!confirm('Replace all data on this phone with the backup?')) return;
    S = data; save(); view = 'history'; render(); toast('Backup imported');
  } catch (err) { toast('That file is not a valid backup'); }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'joinForm') {
    const name = $('#joinName').value.trim().replace(/\s+/g, ' ');
    if (!name) return;
    const existing = [...S.roster, ...S.current.players].find(p => p.toLowerCase() === name.toLowerCase());
    if (existing && activePlayers(S.current).includes(existing)) { toast(`${existing} is already playing`); return; }
    if (!existing) S.roster.push(name);
    changePlayers(existing || name, true);
    return;
  }
  const inp = $('#newName'), name = inp.value.trim().replace(/\s+/g, ' ');
  if (!name) return;
  if (S.roster.some(p => p.toLowerCase() === name.toLowerCase())) { toast(`${name} is already on the list`); return; }
  S.roster.push(name);
  if (S.selected.length < MAX_P) S.selected.push(name);
  save(); render();
});

// The tournament a Games/Table action applies to: the one being viewed
const viewedTournament = () => (view === 'past' ? S.history[pastIdx] : S.current);

document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) return;
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  // Clicks inside the sheet should not close it via the overlay
  if (b.classList.contains('overlay') && e.target !== b) return;
  const act = b.dataset.act, t = S.current;
  switch (act) {
    case 'tab': view = b.dataset.view; modal = null; render(); window.scrollTo(0, 0); break;
    case 'toggle': {
      const nm = b.dataset.name;
      S.selected = S.selected.includes(nm) ? S.selected.filter(p => p !== nm) : [...S.selected, nm];
      save(); render(); break;
    }
    case 'rosterEdit': rosterEdit = !rosterEdit; render(); break;
    case 'remove': {
      const nm = b.dataset.name;
      if (!confirm(`Remove ${nm} from the player list? Past results are kept.`)) return;
      S.roster = S.roster.filter(p => p !== nm);
      S.selected = S.selected.filter(p => p !== nm);
      save(); render(); break;
    }
    case 'start': {
      const sel = S.selected.filter(p => S.roster.includes(p));
      S.current = Sched.build(sel);
      view = 'play'; save(); render(); break;
    }
    case 'players': modal = { kind: 'players' }; render(); break;
    case 'closeModal': modal = null; render(); break;
    case 'leave': changePlayers(b.dataset.name, false); break;
    case 'join': changePlayers(b.dataset.name, true); break;
    case 'play': t.live = nextMatch(t).id; save(); render(); break;
    case 'stop': t.live = null; save(); render(); break;
    case 'winner': setWinner(t, +b.dataset.id, b.dataset.side); break;
    case 'mwinner': setWinner(modal.t, +b.dataset.id, b.dataset.side); break;
    case 'swap': modal = { kind: 'swap' }; render(); break;
    case 'swapTo': {
      const i = nextMatch(t).id, j = +b.dataset.id;
      Sched.swapGames(t, i, j);
      modal = null; save(); render();
      toast('Games swapped', 'Undo', () => { Sched.swapGames(t, i, j); save(); render(); });
      break;
    }
    case 'draw': doDraw(); break;
    case 'edit': modal = { kind: 'edit', t: viewedTournament(), id: +b.dataset.id }; render(); break;
    case 'clear': {
      const m = modal.t.matches[modal.id];
      m.w = null; m.at = null;
      modal = null; save(); render(); break;
    }
    case 'addGame': modal = { kind: 'add', t: viewedTournament(), a: [], b: [] }; render(); break;
    case 'addPick': {
      const side = modal[b.dataset.side], nm = b.dataset.name, i = side.indexOf(nm);
      i >= 0 ? side.splice(i, 1) : side.push(nm);
      render(); break;
    }
    case 'addSave': {
      const tt = modal.t, g = Sched.addGame(tt, modal.a, modal.b, b.dataset.side);
      modal = null; save(); render();
      toast('Game added', 'Undo', () => { Sched.removeGame(tt, tt.matches.indexOf(g)); save(); render(); });
      break;
    }
    case 'delGame': {
      if (!confirm('Delete this added game?')) return;
      Sched.removeGame(modal.t, modal.id);
      modal = null; save(); render(); break;
    }
    case 'tmode': tableMode = b.dataset.v; render(); break;
    case 'finish': finishTournament(t); break;
    case 'menu': {
      const played = playedCount(t);
      if (played === 0) {
        if (confirm('No games played yet. Cancel this tournament?')) { S.current = null; view = 'play'; save(); render(); }
      } else if (confirm(`End the tournament now and save it to history? (${played} of ${t.matches.length} games played)`)) {
        finishTournament(t);
      }
      break;
    }
    case 'openPast': view = 'past'; pastIdx = +b.dataset.i; tableMode = 'all'; render(); window.scrollTo(0, 0); break;
    case 'backHistory': view = shared ? 'shared' : 'history'; render(); window.scrollTo(0, 0); break;
    case 'delHist':
      if (confirm('Delete this tournament from history?')) { S.history.splice(pastIdx, 1); view = 'history'; save(); render(); }
      break;
    case 'profile': modal = { kind: 'profile', name: b.dataset.name }; render(); break;
    case 'shareOne': { const pt = S.history[pastIdx]; shareLink([pt], `Foosball ${day(pt)}`); break; }
    case 'shareAll': shareLink(S.history, 'Foosball all-time stats'); break;
    case 'saveShared': {
      const have = new Set(S.history.map(h => h.id));
      const add = shared.filter(x => !have.has(x.id)).map(x => { const c = { ...x }; delete c.shared; return c; });
      S.history.push(...add);
      S.history.sort((x, y) => String(y.started).localeCompare(String(x.started)));
      save();
      toast(add.length ? `Saved ${add.length} tournament${add.length > 1 ? 's' : ''}` : 'Already saved on this phone');
      break;
    }
    case 'closeShared': closeShared(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
  }
});

// ---------- keep screen awake while a game is on ----------
let wakeLock = null;
async function updateWakeLock() {
  const want = !!S.current && !shared && view === 'play' && document.visibilityState === 'visible';
  try {
    if (want && !wakeLock && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* not supported or denied - fine */ }
}
document.addEventListener('visibilitychange', updateWakeLock);
window.addEventListener('hashchange', () => { openSharedLink(); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
openSharedLink().then(opened => { if (!opened) render(); });
</script>
</body>
</html>
